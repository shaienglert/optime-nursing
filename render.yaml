services:
  - type: web
    name: optime-nursing-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://optime-nursing.vercel.app
      - key: OPTIME_IMPORT_STATE
        value: FL
      - key: OPTIME_IMPORT_LIMIT
        value: "100"
