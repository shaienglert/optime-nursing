name: Nevada Production Recommendation Runtime

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/database.py'
      - 'backend/app/services/__init__.py'
      - 'backend/app/services/canonical_universe.py'
      - 'backend/app/services/facility_parameter_service.py'
      - 'backend/app/services/human_intelligence_runtime.py'
      - 'backend/app/services/human_intelligence_runtime_verified.py'
      - 'backend/app/services/living_strategy_runtime.py'
      - 'backend/app/services/client_intent_runtime.py'
      - 'backend/app/services/success_factor_runtime.py'
      - 'backend/app/services/decision_governance_runtime.py'
      - 'backend/app/services/decision_agent_bridge.py'
      - 'backend/app/services/decision_research_worker.py'
      - 'backend/app/services/patient_decision_engine.py'
      - 'backend/app/services/patient_decision_engine/**'
      - 'backend/app/services/patient_decision_engine_runtime/**'
      - 'backend/requirements.txt'
      - 'backend/tests/test_database_runtime.py'
      - 'backend/tests/test_main_decision_runtime_contract.py'
      - 'backend/tests/test_nevada_production_runtime.py'
      - 'backend/tests/test_patient_decision_engine_import_resolution.py'
      - 'backend/tests/test_human_intelligence_runtime_integration.py'
      - 'backend/tests/test_adaptive_interview_roundtrip.py'
      - 'backend/tests/test_success_factor_runtime.py'
      - 'backend/tests/test_decision_governance_runtime.py'
      - 'backend/tests/test_decision_agent_bridge.py'
      - 'frontend/src/app/adaptive-interview/**'
      - 'frontend/src/app/api/ops/smoke/recommendations/**'
      - 'database/las_vegas_person_fit_summary_v1.b64'
      - 'database/nevada_facility_universe_canonical.json'
      - 'database/optime_parameter_registry.json'
      - '.github/workflows/nevada-production-runtime.yml'
  workflow_dispatch:

jobs:
  las-vegas-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      OPTIME_CANONICAL_MARKET: las-vegas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run deterministic Nevada runtime tests
        run: |
          python -m unittest \
            backend.tests.test_database_runtime \
            backend.tests.test_facility_parameter_service \
            backend.tests.test_nevada_production_runtime \
            backend.tests.test_patient_decision_engine_import_resolution \
            backend.tests.test_human_intelligence_runtime_integration \
            backend.tests.test_adaptive_interview_roundtrip \
            backend.tests.test_success_factor_runtime \
            backend.tests.test_decision_governance_runtime \
            backend.tests.test_decision_agent_bridge \
            backend.tests.test_main_decision_runtime_contract
      - name: Run real son, self, and couple rehab personas through integrated decision engine
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from app.services.patient_decision_engine import run_patient_decision_engine

          base = {
              'relationship': 'Dad',
              'ageGroup': '80-84',
              'assistanceLevel': 'Needs assistance with bathing and dressing',
              'memoryStatus': 'No',
              'budget': 6500,
              'distanceFromFamily': 'Balanced location',
          }
          query = (
              'My father is 84, recently widowed, and lives in Las Vegas. '
              'He has difficulty with bathing, dressing, meals and medication. '
              'He is mentally alert, has no dementia, is still mobile, and needs daily help.'
          )
          personas = {
              'son_for_father': {'questionnaire_state': base, 'natural_language_query': query},
              'self_search': {
                  'questionnaire_state': {**base, 'relationship': 'Myself'},
                  'natural_language_query': query.replace('My father is', 'I am').replace('He has', 'I have').replace('He is', 'I am').replace('needs daily help', 'need daily help'),
              },
          }

          output = {}
          for key, persona in personas.items():
              result = run_patient_decision_engine(**persona, limit=5)
              assert result['result_count'] > 0, f'{key}: no recommendations'
              assert result['total_candidates_scored'] > 0, f'{key}: no candidates scored'
              assert result['patient_needs_profile']['location_city'] == 'LAS VEGAS', f'{key}: location not governed'
              assert result['care_setting_policy']['version'] == 'v1.1', f'{key}: wrong care-setting policy'
              assert result['decision_intelligence']['version'] == 'decision-intelligence-runtime-v3.1', f'{key}: decision intelligence missing'
              assert result['decision_intelligence']['ranking_order'] == ['CLIENT_INTENT','MUST_GATE','NICE_TO_HAVE','GOVERNMENT_REGULATORY_DATA','PUBLIC_REPUTATION','RELEVANT_EVIDENCE_COMPLETENESS']
              assert 'living_strategy' in result['decision_intelligence'], f'{key}: living strategy missing'
              assert 'client_intent' in result['decision_intelligence'], f'{key}: client intent missing'
              human = result['decision_intelligence']['human_intelligence']
              assert human['signals']['recent_bereavement']['value'] == 'YES', f'{key}: bereavement signal lost'
              assert human['decision_readiness'] == 'NEEDS_CLARIFICATION', f'{key}: missing clarification gate'
              question_keys = [q['question_key'] for q in human['adaptive_questions']]
              assert question_keys == ['community_size_preference', 'social_interaction_need_after_loss', 'move_participation'], f'{key}: wrong NBQ sequence {question_keys}'
              assert len(result['decision_intelligence']['success_factor_policy']['factors']) == 16, f'{key}: success-factor canon disconnected'
              assert 'recommendation_audit_trace' in result, f'{key}: audit trace missing'
              assert all((row.get('client_intent_fit') or {}).get('hard_gate') != 'FAIL' for row in result['results']), f'{key}: MUST-failed result escaped gate'
              for row in result['results']:
                  assert str(row.get('state') or '').upper() == 'NV', f'{key}: non-NV result {row}'
                  assert str(row.get('city') or '').strip().lower() == 'las vegas', f'{key}: city constraint missed {row}'
                  assert 'human_person_fit' in row, f'{key}: person-fit evidence missing'
                  assert len(row['success_factor_trace']['factors']) == 16, f'{key}: per-facility factor trace incomplete'
              output[key] = {'decision_readiness': human['decision_readiness'], 'adaptive_questions': question_keys, 'top5': [row.get('facility_name') for row in result['results']]}

          plain_query = (
              'My father is 84 and lives in Las Vegas. He is mentally alert and mobile, has no dementia, '
              'and needs help with bathing, dressing, meals and medication.'
          )
          plain = run_patient_decision_engine(base, plain_query, limit=5)
          plain_human = plain['decision_intelligence']['human_intelligence']
          plain_questions = [q['question_key'] for q in plain_human['adaptive_questions']]
          assert plain_human['decision_readiness'] == 'NEEDS_CLARIFICATION', 'plain assisted-living case skipped clarification'
          assert plain_questions == ['community_size_preference', 'social_interaction_preference'], f'plain case wrong NBQ sequence {plain_questions}'
          assert plain['decision_intelligence']['decision_finality'] == 'PROVISIONAL_PENDING_RESIDENT_CLARIFICATION'
          output['plain_assisted_living'] = {'decision_readiness': plain_human['decision_readiness'], 'adaptive_questions': plain_questions}

          def answered(size):
              state = deepcopy(base)
              state['humanIntelligenceV2'] = {
                  'personalityProfile': {'communitySizePreference': size},
                  'familyProfile': {'socialInteractionNeed': 'Neither'},
                  'transitionRiskProfile': {'attitudeTowardMove': 'Cautious but open'},
              }
              return run_patient_decision_engine(state, query, limit=5)

          large = answered('Large community')
          small = answered('Small community')
          large_ids = [r['canonical_facility_id'] for r in large['results']]
          small_ids = [r['canonical_facility_id'] for r in small['results']]
          assert large_ids != small_ids, 'Explicit environment preference does not change Top-5'
          output['answered_variants'] = {'large_top5': [r['facility_name'] for r in large['results']], 'small_top5': [r['facility_name'] for r in small['results']]}

          couple_state = {
              'relationship': 'Dad',
              'ageGroup': '80+',
              'assistanceLevel': 'Needs assistance with bathing and dressing',
              'memoryStatus': 'No',
              'distanceFromFamily': 'Balanced location',
              'humanIntelligenceV2': {
                  'personalityProfile': {'communitySizePreference': 'Large community'},
                  'familyProfile': {'socialInteractionNeed': 'Very important'},
              },
          }
          couple_query = (
              'A couple age 80+ wants to move to senior living in Las Vegas with lots of culture, classes and activities. '
              'The husband had spinal surgery and needs rehabilitation. He is expected to return to walking, but for the next '
              '3 months he needs help with bathing and dressing. The wife is independent and they want to live together.'
          )
          couple = run_patient_decision_engine(couple_state, couple_query, limit=5)
          strategy = couple['decision_intelligence']['living_strategy']
          intent = couple['decision_intelligence']['client_intent']
          assert strategy['household']['type'] == 'COUPLE', strategy
          assert strategy['signals']['spine_or_back_surgery'] is True, strategy
          assert strategy['signals']['expected_recovery'] is True, strategy
          assert strategy['signals']['temporary_support_duration_months'] == 3, strategy
          strategy_ids = [s['strategy_id'] for s in strategy['strategy_candidates']]
          assert {'INDEPENDENT_LIVING_PLUS_TEMPORARY_CARE','POST_ACUTE_REHAB_THEN_INDEPENDENT_LIVING','LIFE_PLAN_CCRC','ASSISTED_LIVING'}.issubset(set(strategy_ids)), strategy_ids
          must_keys = {m['key'] for m in intent['must_haves']}
          assert {'LAS_VEGAS','COUPLE_CORESIDENCE','ADL_SUPPORT_AVAILABLE','REHAB_PATH_AVAILABLE','RECOVERY_TRANSITION_COMPATIBLE'}.issubset(must_keys), must_keys
          assert 'RICH_CULTURE_AND_ACTIVITIES' in {n['key'] for n in intent['nice_to_haves']}
          couple_questions = [q['question_key'] for q in couple['decision_intelligence']['human_intelligence']['adaptive_questions']]
          for required in ('medicare_status', 'move_timing_vs_rehab', 'monthly_budget', 'ccrc_entrance_fee_tolerance'):
              assert required in couple_questions, couple_questions
          assert couple['decision_intelligence']['decision_finality'].startswith('PROVISIONAL_'), couple['decision_intelligence']['decision_finality']
          assert all((r.get('client_intent_fit') or {}).get('hard_gate') != 'FAIL' for r in couple['results'])
          need_ids = {n['parameter_id'] for n in couple['patient_needs_profile']['needs']}
          assert {'pt', 'ot', 'adl_support'}.issubset(need_ids), need_ids
          output['couple_rehab'] = {
              'strategy_ids': strategy_ids,
              'must_keys': sorted(must_keys),
              'questions': couple_questions,
              'strategy_universe': couple['decision_intelligence']['strategy_universe'],
              'decision_finality': couple['decision_intelligence']['decision_finality'],
              'top5': [r['facility_name'] for r in couple['results']],
          }
          print('NEVADA_PERSONA_E2E=' + json.dumps(output, indent=2))
          PY
