name: Nevada Production Recommendation Runtime

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/database.py'
      - 'backend/app/services/__init__.py'
      - 'backend/app/services/canonical_universe.py'
      - 'backend/app/services/facility_parameter_service.py'
      - 'backend/app/services/human_intelligence_runtime.py'
      - 'backend/app/services/human_intelligence_runtime_verified.py'
      - 'backend/app/services/living_strategy_runtime.py'
      - 'backend/app/services/client_intent_runtime.py'
      - 'backend/app/services/ai_process_owner_runtime.py'
      - 'backend/app/services/provider_housing_runtime.py'
      - 'backend/app/services/public_reputation_runtime.py'
      - 'backend/app/services/success_factor_runtime.py'
      - 'backend/app/services/decision_governance_runtime.py'
      - 'backend/app/services/decision_agent_bridge.py'
      - 'backend/app/services/decision_research_worker.py'
      - 'backend/app/services/decision_engine_core.py'
      - 'backend/app/services/decision_engine_evidence.py'
      - 'backend/app/services/decision_pipeline.py'
      - 'backend/app/services/patient_decision_engine/**'
      - 'backend/app/services/patient_decision_engine_runtime/**'
      - 'backend/requirements.txt'
      - 'backend/tests/test_database_runtime.py'
      - 'backend/tests/test_main_decision_runtime_contract.py'
      - 'backend/tests/test_nevada_production_runtime.py'
      - 'backend/tests/test_provider_housing_runtime.py'
      - 'backend/tests/test_patient_decision_engine_import_resolution.py'
      - 'backend/tests/test_human_intelligence_runtime_integration.py'
      - 'backend/tests/test_adaptive_interview_roundtrip.py'
      - 'backend/tests/test_success_factor_runtime.py'
      - 'backend/tests/test_decision_governance_runtime.py'
      - 'backend/tests/test_decision_agent_bridge.py'
      - 'backend/tests/test_ai_process_owner_runtime.py'
      - 'backend/tests/test_decision_quality_market_and_regulatory.py'
      - 'backend/tests/test_decision_quality_strategy_families.py'
      - 'backend/tests/test_decision_quality_topn_causality.py'
      - 'backend/tests/test_decision_quality_topn_gates.py'
      - 'backend/tests/test_golden_topn_decision_quality.py'
      - 'data/nevada/verified/independent_living_primary_evidence.json'
      - 'data/nevada/verified/provider_housing_primary_evidence.json'
      - 'data/nevada/verified/life_plan_primary_evidence.json'
      - 'data/nevada/verified/public_reputation_snapshot.json'
      - 'frontend/src/app/adaptive-interview/**'
      - 'frontend/src/lib/decision-fact-canonicalization.ts'
      - 'frontend/src/app/api/ops/smoke/recommendations/**'
      - 'database/las_vegas_person_fit_summary_v1.b64'
      - 'database/nevada_facility_universe_canonical.json'
      - 'database/optime_parameter_registry.json'
      - '.github/workflows/nevada-production-runtime.yml'
  workflow_dispatch:

jobs:
  las-vegas-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      OPTIME_CANONICAL_MARKET: las-vegas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      # Run with pytest, not unittest. Six of the modules below hold their tests as
      # plain module-level functions rather than TestCase subclasses, and
      # `python -m unittest` collects only TestCase. This job reported success having
      # executed none of them: 30 tests across the decision-quality suite -- the ones
      # asserting that the product recommends the right thing -- were invisible here
      # while the job stayed green.
      - name: Run deterministic Nevada runtime and golden decision-quality tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_database_runtime.py \
            tests/test_facility_parameter_service.py \
            tests/test_nevada_production_runtime.py \
            tests/test_provider_housing_runtime.py \
            tests/test_patient_decision_engine_import_resolution.py \
            tests/test_human_intelligence_runtime_integration.py \
            tests/test_adaptive_interview_roundtrip.py \
            tests/test_success_factor_runtime.py \
            tests/test_decision_governance_runtime.py \
            tests/test_decision_agent_bridge.py \
            tests/test_ai_process_owner_runtime.py \
            tests/test_main_decision_runtime_contract.py \
            tests/test_decision_quality_market_and_regulatory.py \
            tests/test_decision_quality_strategy_families.py \
            tests/test_decision_quality_topn_causality.py \
            tests/test_decision_quality_topn_gates.py \
            tests/test_golden_topn_decision_quality.py
      - name: Verify unified AI interview, Guardian, Valley and READY contracts
        run: |
          python - <<'PY'
          import json
          import os
          from copy import deepcopy

          import app.services.human_intelligence_runtime_verified as hi_runtime
          import app.services.must_ai_nice_pipeline as must_pipeline
          import app.services.governed_evidence_runtime as evidence_runtime
          from app.services.patient_decision_engine import run_patient_decision_engine

          os.environ['OPTIME_SEMANTIC_AI_ENABLED'] = '1'
          os.environ['OPTIME_SEMANTIC_AI_REQUIRED'] = '1'
          os.environ['OPTIME_AI_CANDIDATE_RANKING_REQUIRED'] = '1'

          # Every persona below states a budget, now also a facility-owned MUST (see
          # semantic_facility_requirements.py's SEMANTIC_BUDGET_VERIFICATION). No
          # facility in the real Nevada data this script runs against has verified
          # pricing evidence, so without this every candidate would gate to
          # PENDING_VERIFICATION on budget alone -- unrelated to what this verifier
          # actually checks (interview/Guardian/Valley/READY contract behavior). This
          # wraps the real evidence lookup rather than replacing it, so the exact,
          # real-data-driven eligible counts these scenarios assert on (e.g. exactly
          # one facility for the couple/rehab persona) are preserved.
          _real_agent_and_provider_payloads = evidence_runtime.agent_and_provider_payloads

          def _payloads_with_verified_budget(row):
              # Explicit synthetic price for this contract fixture only. Keep the
              # real affordability comparison; disclosure alone is not enough.
              row['starting_monthly_price'] = 2800
              return _real_agent_and_provider_payloads(row)

          evidence_runtime.agent_and_provider_payloads = _payloads_with_verified_budget

          def unavailable_required_ranking(rows, **_kwargs):
              return list(rows), {
                  'status': 'REQUIRED_BUT_UNAVAILABLE',
                  'candidate_count': len(rows),
                  'closed_world_validated': True,
              }

          must_pipeline.rank_must_eligible_candidates = unavailable_required_ranking

          VALLEY_CITIES = {
              'las vegas', 'henderson', 'north las vegas', 'paradise',
              'spring valley', 'enterprise', 'winchester', 'sunrise manor',
          }
          EXPECTED_RANKING_ORDER = [
              'DETERMINISTIC_MUST_GATE',
              'SEMANTIC_AI_DYNAMIC_PREFERENCES',
              'SEMANTIC_AI_ALL_GOVERNED_EVIDENCE',
              'EVIDENCE_GROUNDED_PREFERENCE_COVERAGE',
              'PROVIDER_VERIFICATION',
              'AI_RERANK',
          ]

          base = {
              'relationship': 'Dad',
              'ageGroup': '80-84',
              'assistanceLevel': 'Needs assistance with bathing and dressing',
              'memoryStatus': 'No',
              'budget': 6500,
              'distanceFromFamily': 'Balanced location',
          }
          # This verifier exercises interview/Guardian/Valley/READY behavior. Medication
          # verification has its own Golden Mother90 MUST contract, so do not inject an
          # unrelated facility-owned medication requirement into this generic persona.
          query = (
              'My father is 84, recently widowed, and lives in Las Vegas. '
              'He has difficulty with bathing, dressing and meals. '
              'He is mentally alert, has no dementia, is still mobile, and needs daily help.'
          )

          clarification_question = 'What matters most to him about the social environment in his next home?'
          hi_runtime.interpret_client_intent_with_ai = lambda **kwargs: {
              'decision_readiness': 'NEEDS_CLARIFICATION',
              'next_question': clarification_question,
              'statements': [{
                  'raw_text': 'Social-environment preference is unknown.',
                  'meaning': 'Preferred social intensity can refine ranking.',
                  'importance': 'NICE',
                  'knowledge_state': 'UNKNOWN',
                  'status': 'ASKED',
                  'gap_key': 'loneliness_severity',
                  'mapped_parameters': ['social_interaction_need_after_loss'],
                  'clarification_question': clarification_question,
                  'research_task': None,
              }],
          }
          nonblocking = run_patient_decision_engine(base, query, limit=5)
          human = nonblocking['decision_intelligence']['human_intelligence']
          assert human['decision_readiness'] == 'READY', human
          assert human['interview_policy']['owner'] == 'SEMANTIC_AI', human
          assert human['interview_policy']['hard_coded_question_generation_forbidden'] is True, human
          assert human['adaptive_questions'] == []
          assert any(
              row['gap_key'] == 'loneliness_severity' and row['classification'] == 'IMPORTANT_NON_BLOCKING'
              for row in human['canonical_gap_policy']['assessments']
          )
          # Ranking AI is advisory: its unavailability must preserve the verified
          # MUST-qualified set, explicitly labeled as degraded and unranked.
          assert nonblocking['result_count'] == 5 and len(nonblocking['results']) == 5
          assert nonblocking['decision_intelligence']['recommendation_execution_allowed'] is True
          assert nonblocking['decision_intelligence']['canonical_decision_state']['phase'] == 'UNRANKED_ELIGIBLE_SET'

          hi_runtime.interpret_client_intent_with_ai = lambda **kwargs: {
              'decision_readiness': 'READY', 'next_question': None, 'statements': [],
          }
          ready_variant = run_patient_decision_engine(base, query, limit=5)
          ready_human = ready_variant['decision_intelligence']['human_intelligence']
          assert ready_human['decision_readiness'] == human['decision_readiness'] == 'READY'
          assert ready_variant['result_count'] == nonblocking['result_count'] == 5

          hi_runtime.interpret_client_intent_with_ai = lambda **kwargs: {
              'decision_readiness': 'READY', 'next_question': None, 'statements': [],
          }

          base_ready = deepcopy(base)
          base_ready['humanIntelligenceV2'] = {
              'personalityProfile': {'communitySizePreference': 'Large community'},
              'familyProfile': {'socialInteractionNeed': 'Neither'},
              'transitionRiskProfile': {'attitudeTowardMove': 'Cautious but open'},
              'scoringEngine': {'adaptiveSignals': []},
          }
          personas = {
              'son_for_father': {'questionnaire_state': base_ready, 'natural_language_query': query},
              'self_search': {
                  'questionnaire_state': {**base_ready, 'relationship': 'Myself'},
                  'natural_language_query': query.replace('My father is', 'I am').replace('He has', 'I have').replace('He is', 'I am').replace('needs daily help', 'need daily help'),
              },
          }

          output = {
              'nonblocking_preference_variance': {
                  'question': clarification_question,
                  'decision_readiness': human['decision_readiness'],
                  'ready_variant_readiness': ready_human['decision_readiness'],
                  'result_count': nonblocking['result_count'],
              },
          }
          for key, persona in personas.items():
              result = run_patient_decision_engine(**persona, limit=5)
              # The interview is READY and the ranking provider is deliberately
              # unavailable. Canonical authority still releases the verified
              # MUST-qualified set without implying that AI ranked it.
              assert result['decision_intelligence']['recommendation_execution_allowed'] is True, key
              assert result['decision_intelligence']['interview_owner'] == 'SEMANTIC_AI', key
              assert result['result_count'] == 5, f'{key}: eligible candidates were erased by ranking AI failure'
              assert result['patient_needs_profile']['location_city'] == 'LAS VEGAS', f'{key}: location not governed'
              assert result['decision_intelligence']['ranking_order'] == EXPECTED_RANKING_ORDER
              human = result['decision_intelligence']['human_intelligence']
              assert human['decision_readiness'] == 'READY', human
              assert human['adaptive_questions'] == []
              assert human['signals']['recent_bereavement']['value'] == 'YES'
              assert len(result['results']) == 5
              for row in result['results']:
                  assert str(row.get('state') or '').upper() == 'NV', f'{key}: non-NV result {row}'
                  assert str(row.get('city') or '').strip().lower() in VALLEY_CITIES, f'{key}: outside Valley {row}'
                  assert 'human_person_fit' in row
                  assert len(row['success_factor_trace']['factors']) == 16
              output[key] = {'decision_readiness': 'READY', 'top5': [row.get('facility_name') for row in result['results']]}

          def answered(size):
              state = deepcopy(base)
              state['humanIntelligenceV2'] = {
                  'personalityProfile': {'communitySizePreference': size},
                  'familyProfile': {'socialInteractionNeed': 'Neither'},
                  'transitionRiskProfile': {'attitudeTowardMove': 'Cautious but open'},
                  'scoringEngine': {'adaptiveSignals': []},
              }
              return run_patient_decision_engine(state, query, limit=5)

          large = answered('Large community')
          small = answered('Small community')
          assert large['decision_intelligence']['recommendation_execution_allowed'] is True
          assert small['decision_intelligence']['recommendation_execution_allowed'] is True
          assert len(large['results']) == 5
          assert len(small['results']) == 5
          output['answered_variants'] = {
              'large_top5': [r['facility_name'] for r in large['results']],
              'small_top5': [r['facility_name'] for r in small['results']],
          }

          couple_state = {
              'relationship': 'Wife',
              'ageGroup': '80+',
              'assistanceLevel': 'Needs assistance with bathing and dressing',
              'memoryStatus': 'No',
              'distanceFromFamily': 'Balanced location',
              'humanIntelligenceV2': {
                  'familyProfile': {'socialInteractionNeed': 'Very important'},
                  'personalityProfile': {'communitySizePreference': 'No preference'},
                  'transitionRiskProfile': {'attitudeTowardMove': 'Wants to move'},
              },
          }
          couple_query = (
              'A couple age 80+ wants to move to senior living in Las Vegas with lots of culture, classes and activities. '
              'The husband had spinal surgery and is expected to recover, but for the next 3 months he needs help with bathing and dressing. '
              'The wife is independent and they want to live together.'
          )
          couple_question = 'What does the rehabilitation team say is needed next?'
          couple_answers = iter([
              {'decision_readiness': 'READY', 'next_question': None, 'statements': []},
              {'decision_readiness': 'NEEDS_CLARIFICATION', 'next_question': couple_question, 'statements': []},
              {'decision_readiness': 'NEEDS_CLARIFICATION', 'next_question': couple_question, 'statements': []},
              {'decision_readiness': 'NEEDS_CLARIFICATION', 'next_question': couple_question, 'statements': []},
          ])
          hi_runtime.interpret_client_intent_with_ai = lambda **kwargs: next(couple_answers)
          couple_blocked = run_patient_decision_engine(couple_state, couple_query, limit=5)
          couple_human = couple_blocked['decision_intelligence']['human_intelligence']
          unknowns = set(couple_human['living_strategy_guardian']['material_unknowns'])
          for required in ('rehab_level_needed', 'medicare_status', 'move_timing_vs_rehab', 'monthly_budget', 'ccrc_entrance_fee_tolerance'):
              assert required in unknowns, (required, unknowns)
          assert couple_blocked['decision_intelligence']['recommendation_execution_allowed'] is False
          assert couple_blocked['results'] == []
          assert len(couple_human['adaptive_questions']) == 1
          assert couple_human['adaptive_questions'][0].get('target_fact_key') == couple_human['readiness_guardian']['client_owned_blockers'][0]['fact_key']
          assert couple_human['readiness_guardian']['veto_resolution'] == 'DETERMINISTIC_CANONICAL_FALLBACK'

          couple_ready = deepcopy(couple_state)
          couple_ready.update({
              'budget': 8000,
              'medicareStatus': 'Original Medicare',
              'moveTiming': 'Move during recovery',
              'entranceFeeTolerance': 'No',
          })
          couple_ready['humanIntelligenceV2']['transitionRiskProfile']['postHospitalRehabNeed'] = 'No'
          hi_runtime.interpret_client_intent_with_ai = lambda **kwargs: {
              'decision_readiness': 'READY', 'next_question': None, 'statements': [],
          }
          couple = run_patient_decision_engine(couple_ready, couple_query + ' The clinical team says only personal-care help is needed, not skilled rehab. Our budget is $8,000 monthly; he has Original Medicare; we want to move during recovery and do not want a CCRC entrance fee.', limit=5)
          assert couple['decision_intelligence']['recommendation_execution_allowed'] is True
          assert len(couple['results']) == couple['decision_intelligence']['facility_selection_pipeline']['must_eligible_count'] == 1
          strategy = couple['decision_intelligence']['living_strategy']
          assert strategy['household']['type'] == 'COUPLE', strategy
          assert strategy['signals']['spine_or_back_surgery'] is True
          assert strategy['signals']['expected_recovery'] is True
          assert strategy['signals']['temporary_support_duration_months'] == 3
          strategy_ids = [s['strategy_id'] for s in strategy['strategy_candidates']]
          assert {'INDEPENDENT_LIVING_PLUS_TEMPORARY_CARE','POST_ACUTE_REHAB_THEN_INDEPENDENT_LIVING','LIFE_PLAN_CCRC','ASSISTED_LIVING'}.issubset(set(strategy_ids)), strategy_ids
          output['couple_rehab'] = {
              'blocked_unknowns': sorted(unknowns),
              'strategy_ids_after_resolution': strategy_ids,
              'top5': [r['facility_name'] for r in couple['results']],
          }

          print('NEVADA_AI_GOVERNED_E2E=' + json.dumps(output, indent=2))
          PY
