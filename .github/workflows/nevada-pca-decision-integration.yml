name: Nevada PCA Decision Integration

on:
  pull_request:
    paths:
      - 'data/nevada/verified/personal_care_agency_operational_evidence.json'
      - 'backend/app/services/personal_care_agency_runtime.py'
      - 'backend/app/services/patient_decision_engine_runtime/**'
      - 'backend/tests/test_pca_decision_runtime_integration.py'
      - '.github/workflows/nevada-pca-decision-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pca-decision-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      OPTIME_CANONICAL_MARKET: las-vegas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run PCA unit and decision integration tests
        run: |
          python -m pytest \
            backend/tests/test_personal_care_agency_runtime.py \
            backend/tests/test_pca_decision_runtime_integration.py -q
