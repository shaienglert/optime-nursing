name: Nevada Registry Refresh

# Licence data decays slowly and silently. Communities open, close, change hands and lose
# endorsements, and nothing in the product notices until a family is matched against a
# facility that shut last spring. Weekly is the right cadence for a state licence file --
# far slower than job postings, far faster than the manual export it replaces.
#
# The database is refreshed by the scheduled run itself and does not wait for the pull
# request that follows. That ordering is deliberate: the sibling product stranded four
# consecutive discovery runs at the PR step because the repository forbids Actions from
# opening pull requests, and the data silently stopped moving. Here, a PR that never opens
# costs an out-of-date file in git; it does not cost a stale product.

on:
  workflow_dispatch:
    inputs:
      skip_details:
        description: Skip per-licence detail pages (faster, no memory-care evidence)
        type: boolean
        default: false
  schedule:
    # Sunday 07:23 UTC. Off the hour so it does not queue behind every other cron.
    - cron: '23 7 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_nevada_registry.py'
      - 'scripts/extract_nevada_hcqc_alis.py'
      - 'backend/app/ingestion/nevada_hcqc.py'
      - 'backend/app/services/capability_derivation.py'
      - '.github/workflows/nevada-registry-refresh.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nevada-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      # A push or manual run rewrites the file and loads the database. On a push the code
      # changed, so re-deriving against the existing registry is the point; the fetch still
      # runs because a code change is also the moment to confirm the source still answers.
      - name: Refresh registry and apply to the database
        id: refresh
        run: |
          python scripts/refresh_nevada_registry.py --apply \
            ${{ github.event.inputs.skip_details == 'true' && '--skip-details' || '' }}

      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-registry-refresh-${{ github.run_id }}
          path: |
            reports/NEVADA_REGISTRY_REFRESH.json
            data/nevada/verified/nv_hcqc_clark_registry.json
          if-no-files-found: warn
          retention-days: 30

      # The database is already current by this point. This only keeps the repository's copy
      # of the registry in step, and is allowed to fail without failing the run.
      - name: Propose the refreshed registry
        if: success() && github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "optime-nursing-registry[bot]"
          git config user.email "optime-nursing-registry[bot]@users.noreply.github.com"
          git add data/nevada/verified/nv_hcqc_clark_registry.json
          if git diff --cached --quiet; then
            echo "Nevada registry unchanged; nothing to propose."
            exit 0
          fi
          added=$(python -c "import json;d=json.load(open('reports/NEVADA_REGISTRY_REFRESH.json'));print(d.get('licences_added_count',0))")
          removed=$(python -c "import json;d=json.load(open('reports/NEVADA_REGISTRY_REFRESH.json'));print(d.get('licences_removed_count',0))")
          branch="bot/nevada-registry-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "chore(nevada): refresh HCQC licence registry (+${added} / -${removed})"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(nevada): refresh HCQC licence registry (+${added} / -${removed})" \
            --body "Automated weekly refresh from Nevada HCQC / ALiS, run ${GITHUB_RUN_ID}.

          The production database was already updated by this run; this pull request only
          brings the repository copy of the registry back in step. Review the added and
          removed credentials in the run's \`nevada-registry-refresh\` artifact.

          A refresh holding under 80% of the records on file is refused before it reaches
          this step, so a shrinking diff here is a real contraction rather than a broken
          scraping session."

      - name: Report failure plainly
        if: failure()
        run: |
          echo "::error::Nevada registry refresh failed. The registry on disk and the database"
          echo "::error::were left as they were; nothing was overwritten with a partial pull."
          cat reports/NEVADA_REGISTRY_REFRESH.json 2>/dev/null || true
