name: Production current intake diagnostic
on:
  push:
    branches: [diagnostics/production-independent-6500]
permissions:
  contents: read
jobs:
  inspect-current-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Walk current deployed questionnaire and capture decision
        run: npx playwright test tests/browser/production-independent-diagnostic.spec.cjs --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-6500-live-diagnostics
          path: frontend/test-results
