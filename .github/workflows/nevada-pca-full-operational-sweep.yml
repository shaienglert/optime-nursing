name: Nevada PCA Full Operational Sweep

on:
  push:
    branches: [main]
    paths:
      - 'scripts/run_nevada_pca_full_operational_sweep.py'
      - 'scripts/enrich_nevada_pca_operational_primary_sources_v3.py'
      - 'scripts/enrich_nevada_pca_operational_primary_sources_v4.py'
      - 'scripts/promote_nevada_pca_full_sweep_safe.py'
      - 'scripts/materialize_nevada_pca_valley_registry.py'
      - '.github/workflows/nevada-pca-full-operational-sweep.yml'
  pull_request:
    paths:
      - 'scripts/run_nevada_pca_full_operational_sweep.py'
      - 'scripts/enrich_nevada_pca_operational_primary_sources_v3.py'
      - 'scripts/enrich_nevada_pca_operational_primary_sources_v4.py'
      - 'scripts/promote_nevada_pca_full_sweep_safe.py'
      - 'scripts/materialize_nevada_pca_valley_registry.py'
      - '.github/workflows/nevada-pca-full-operational-sweep.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2,5'

permissions:
  contents: read

concurrency:
  group: nevada-pca-full-operational-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-pca-operational-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: backend:.:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check requests pytest
      - name: Rebuild live Nevada PCA universe
        run: python scripts/extract_nevada_hcqc_personal_care_agencies.py
      - name: Materialize complete canonical Valley PCA registry
        run: python scripts/materialize_nevada_pca_valley_registry.py
      - name: Gate complete canonical registry
        run: |
          python - <<'PY'
          import csv, json, pathlib
          j=json.loads(pathlib.Path('data/nevada/canonical/nevada_las_vegas_valley_personal_care_agencies.json').read_text())
          rows=list(csv.DictReader(pathlib.Path('data/nevada/canonical/nevada_las_vegas_valley_personal_care_agencies.csv').open()))
          assert j['record_count']==363, j
          assert len(rows)==363, len(rows)
          assert len({r['agency_id'] for r in rows})==363
          assert j['cities']=={'LAS VEGAS':302,'HENDERSON':34,'NORTH LAS VEGAS':27}, j
          assert all(r['source_authority']=='Nevada HCQC / ALiS' for r in rows)
          print(json.dumps({'canonical_registry_records':363,'cities':j['cities'],'verified':j.get('operationally_verified_count'),'unknown':j.get('operationally_unknown_count')}, indent=2))
          PY
      - name: Build governed remaining research queue
        run: python scripts/build_nevada_pca_operational_research_queue.py
      - name: Run full operational research sweep with V3 extended enrichment
        run: python scripts/run_nevada_pca_full_operational_sweep.py --chunk-size 25 --workers 4 --throttle 0.05
      - name: Gate full-sweep completeness and integrity
        run: |
          python - <<'PY'
          import json, pathlib
          from urllib.parse import urlparse
          q=json.loads(pathlib.Path('reports/NEVADA_PCA_OPERATIONAL_RESEARCH_QUEUE.json').read_text())
          r=json.loads(pathlib.Path('reports/NEVADA_PCA_OPERATIONAL_FULL_SWEEP.json').read_text())
          assert q['licensed_valley_input_count'] == 363, q
          assert r['attempted'] == q['research_task_count'], (r, q)
          assert r['already_operationally_verified_count'] == q['already_operationally_verified_count'], (r, q)
          assert r['coverage_after_verified_staging'] + r['remaining_after_verified_staging'] == 363, r
          blocked=('cms.gov','medicare.gov','dpbh.nv.gov','nvdpbh.aithent.com','health.nv.gov','myhealthfacilitylicense.nv.gov','aplaceformom.com','caring.com','seniorly.com','yelp.com','facebook.com','instagram.com','linkedin.com','bbb.org','yellowpages.com')
          ids=set()
          for row in r['records']:
              aid=str(row.get('agency_id') or '')
              assert aid and aid not in ids, aid
              ids.add(aid)
              if row.get('identity_verified') is True:
                  domain=urlparse(str(row.get('primary_source_url') or '')).netloc.lower()
                  assert domain and not any(domain==d or domain.endswith('.'+d) for d in blocked), row
          assert len(ids) == r['attempted'], (len(ids), r['attempted'])
          print(json.dumps({
            'licensed_valley': q['licensed_valley_input_count'],
            'already_verified': q['already_operationally_verified_count'],
            'full_sweep_attempted': r['attempted'],
            'new_identity_verified_staging': r['identity_verified'],
            'coverage_after_staging': r['coverage_after_verified_staging'],
            'remaining_after_staging': r['remaining_after_verified_staging'],
          }, indent=2))
          PY
      - name: Build safe strong-identity promotion candidates
        run: python scripts/promote_nevada_pca_full_sweep_safe.py
      - name: Gate safe promotion staging semantics
        run: |
          python - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path('reports/NEVADA_PCA_SAFE_AUTO_PROMOTIONS.json').read_text())
          assert p['schema_version']=='nevada-pca-safe-auto-promotions-v1.2.0', p
          for row in p['records']:
              assert row['identity_verified'] is True, row
              assert row['identity_basis'] in {
                  'PRIMARY_SOURCE_EXACT_PHONE',
                  'PRIMARY_SOURCE_STRONG_ADDRESS_CITY',
                  'PRIMARY_SOURCE_EXACT_LICENSE_ROOT',
              }, row
              assert row['hourly_rate']=='UNKNOWN', row
              for field in ('bathing_assistance','dressing_assistance','transfer_assistance','workers_comp_verified'):
                  assert row[field] in (True, 'UNKNOWN'), (field, row)
          print(json.dumps({
              'safe_promotion_candidates': p['candidate_count'],
              'rejected_weak_identity': p['rejected_weak_identity_count'],
          }, indent=2))
          PY
      - name: Upload complete PCA database and research package
        uses: actions/upload-artifact@v4
        with:
          name: nevada-pca-full-operational-sweep
          retention-days: 90
          path: |
            data/nevada/raw/hcqc_personal_care_agencies.csv
            data/nevada/canonical/nevada_las_vegas_valley_personal_care_agencies.json
            data/nevada/canonical/nevada_las_vegas_valley_personal_care_agencies.csv
            reports/NEVADA_HCQC_PERSONAL_CARE_AGENCIES.json
            reports/NEVADA_PCA_OPERATIONAL_RESEARCH_QUEUE.json
            reports/NEVADA_PCA_OPERATIONAL_FULL_SWEEP.json
            reports/NEVADA_PCA_SAFE_AUTO_PROMOTIONS.json
