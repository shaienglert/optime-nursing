name: Adaptive Interview UI Patch

on:
  push:
    branches:
      - fix/adaptive-interview-ui-v1
    paths:
      - .github/workflows/adaptive-interview-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adaptive-interview-ui-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch intake and neutral social answer
        run: |
          python - <<'PY'
          from pathlib import Path

          intake = Path('frontend/src/app/intake/page.tsx')
          text = intake.read_text()
          old = '    router.push(`/results?${params.toString()}`);'
          new = '''    const resultsUrl = `/results?${params.toString()}`;\n    router.push(`/adaptive-interview?next=${encodeURIComponent(resultsUrl)}`);'''
          if old not in text:
              raise SystemExit('intake results navigation anchor not found')
          intake.write_text(text.replace(old, new, 1))

          runtime = Path('backend/app/services/human_intelligence_runtime.py')
          text = runtime.read_text()
          anchor = '''def _explicit_low(value: Any) -> bool:\n    return _contains_any(value, ("low", "not important", "rare", "minimal", "no", "none"))\n'''
          replacement = anchor + '''\n\ndef _explicit_neutral(value: Any) -> bool:\n    return _contains_any(value, ("neither", "neutral", "about the same", "no strong preference"))\n'''
          if anchor not in text:
              raise SystemExit('explicit_low anchor not found')
          text = text.replace(anchor, replacement, 1)

          anchor2 = '''    for value, source in explicit:\n        if _explicit_low(value):\n            return {"value": "LOW", "source": source, "confidence": 1.0}\n\n    bereavement = _recent_bereavement(questionnaire, natural_language_query)\n'''
          replacement2 = '''    for value, source in explicit:\n        if _explicit_low(value):\n            return {"value": "LOW", "source": source, "confidence": 1.0}\n    for value, source in explicit:\n        if _explicit_neutral(value):\n            return {"value": "NEUTRAL", "source": source, "confidence": 1.0}\n\n    bereavement = _recent_bereavement(questionnaire, natural_language_query)\n'''
          if anchor2 not in text:
              raise SystemExit('social transition anchor not found')
          runtime.write_text(text.replace(anchor2, replacement2, 1))
          PY
      - name: Remove patch workflow after use
        run: rm .github/workflows/adaptive-interview-ui-patch.yml
      - name: Commit patch
        run: |
          git config user.name "optime-ci"
          git config user.email "optime-ci@users.noreply.github.com"
          git add frontend/src/app/intake/page.tsx backend/app/services/human_intelligence_runtime.py .github/workflows/adaptive-interview-ui-patch.yml
          git commit -m "feat(nursing): route intake through governed adaptive interview"
          git push origin HEAD:fix/adaptive-interview-ui-v1
