name: Temporary Decision Policy Contract Patch

on:
  push:
    branches:
      - fix/decision-engine-api-policy-contract-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decision-engine-api-policy-contract-v1
          fetch-depth: 0
      - name: Patch response model and remove helper workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          old = '''class PatientDecisionEngineOut(BaseModel):\n    patient_needs_profile: Dict[str, Any]\n    results: List[Dict[str, Any]]\n    result_count: int\n    total_candidates_scored: int\n    availability_policy: str\n'''
          new = '''class PatientDecisionEngineOut(BaseModel):\n    patient_needs_profile: Dict[str, Any]\n    results: List[Dict[str, Any]]\n    result_count: int\n    total_candidates_scored: int\n    availability_policy: str\n    care_setting_policy: Dict[str, Any] = Field(default_factory=dict)\n'''
          if old not in text:
              raise SystemExit('PatientDecisionEngineOut contract block not found exactly once')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one response-model block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/tmp-patch-decision-policy-contract.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py .github/workflows/tmp-patch-decision-policy-contract.yml
          git commit -m "fix(nursing): expose governed care-setting policy in API"
          git push origin HEAD:fix/decision-engine-api-policy-contract-v1
