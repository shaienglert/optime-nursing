name: One-shot free-text no-reask patch

on:
  push:
    branches: [fix/nursing-free-text-no-reask]
    paths: [.github/workflows/one-shot-free-text-no-reask.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nursing-free-text-no-reask
      - name: Protect explicit free-text evidence from AI re-asks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/semantic_intent_ai.py')
          s = p.read_text()
          old = '''def _question_reasks_answered_dimension(result: Dict[str, Any], questionnaire_state: Dict[str, Any]) -> bool:\n    next_question = str(result.get("next_question") or "").strip()\n'''
          new = '''def _explicit_user_text_answered_dimensions(user_text: str) -> set[str]:\n    text = str(user_text or "").lower()\n    answered: set[str] = set()\n    if re.search(r"\\b(no mobility limitation(?:s)?|walks? independently|independent with [^.]{0,100}transfers?|uses? (?:a )?(?:walker|wheelchair|cane)|needs? (?:a )?(?:walker|wheelchair|cane))\\b", text):\n        answered.add("mobility")\n    if re.search(r"\\b(no memory concern(?:s)?|no cognitive support|no dementia|cognitively intact|memory concern(?:s)?|dementia|alzheimer)\\b", text):\n        answered.add("cognitive")\n    if re.search(r"\\b(las vegas|north las vegas|henderson|nevada|miami|dallas|houston|austin)\\b", text):\n        answered.add("location")\n    if re.search(r"(?:budget|monthly|per month|afford|cost)[^\\n]{0,60}\\$?\\s*[0-9]{3,6}|\\$\\s*[0-9]{3,6}", text):\n        answered.add("budget")\n    return answered\n\n\ndef _question_reasks_answered_dimension(result: Dict[str, Any], questionnaire_state: Dict[str, Any], user_text: str = "") -> bool:\n    next_question = str(result.get("next_question") or "").strip()\n'''
          if old not in s:
              raise SystemExit('question function header not found')
          s = s.replace(old, new, 1)
          old2 = '''    current = _question_terms(next_question)\n    if not current:\n        return False\n    for entry in _adaptive_answer_summary(questionnaire_state):\n'''
          new2 = '''    current = _question_terms(next_question)\n    if not current:\n        return False\n    if current & _explicit_user_text_answered_dimensions(user_text):\n        return True\n    for entry in _adaptive_answer_summary(questionnaire_state):\n'''
          if old2 not in s:
              raise SystemExit('question body anchor not found')
          s = s.replace(old2, new2, 1)
          old3 = '''def _repair_clarification_contract_with_ai(\n    *,\n    result: Dict[str, Any],\n    payload: Dict[str, Any],\n    questionnaire_state: Dict[str, Any],\n    transport: Callable[[Dict[str, Any]], Dict[str, Any]],\n) -> Dict[str, Any]:\n'''
          new3 = '''def _repair_clarification_contract_with_ai(\n    *,\n    result: Dict[str, Any],\n    payload: Dict[str, Any],\n    questionnaire_state: Dict[str, Any],\n    user_text: str = "",\n    transport: Callable[[Dict[str, Any]], Dict[str, Any]],\n) -> Dict[str, Any]:\n'''
          if old3 not in s:
              raise SystemExit('repair signature not found')
          s = s.replace(old3, new3, 1)
          s = s.replace('_question_reasks_answered_dimension(result, questionnaire_state)', '_question_reasks_answered_dimension(result, questionnaire_state, user_text)')
          s = s.replace('_question_reasks_answered_dimension(repaired, questionnaire_state)', '_question_reasks_answered_dimension(repaired, questionnaire_state, user_text)')
          # Both live orchestration calls use the original client text as evidence.
          needle = '''            questionnaire_state=questionnaire_state,\n            transport=active_transport,\n        )\n'''
          # Only inject user_text into clarification repair calls, not minimum repair.
          marker = 'result = _repair_clarification_contract_with_ai('
          pos = 0
          out = ''
          while True:
              i = s.find(marker, pos)
              if i < 0:
                  out += s[pos:]
                  break
              out += s[pos:i]
              j = s.find('        )\n', i)
              block = s[i:j+10]
              if 'user_text=user_text' not in block:
                  block = block.replace('            questionnaire_state=questionnaire_state,\n', '            questionnaire_state=questionnaire_state,\n            user_text=user_text,\n', 1)
              out += block
              pos = j + 10
          p.write_text(out)
          PY
      - name: Add regression coverage
        run: |
          cat >> backend/tests/test_semantic_clarification_contract_repair.py <<'PY'


def test_explicit_free_text_mobility_answer_blocks_reask_before_any_adaptive_signal():
    packet = {
        "decision_readiness": "NEEDS_CLARIFICATION",
        "next_question": "Does she use a walker, cane, wheelchair, or need help walking at all?",
    }
    text = "She is fully independent with transfers and has no mobility limitation."
    assert _question_reasks_answered_dimension(packet, {}, text) is True
PY
          python -m py_compile backend/app/services/semantic_intent_ai.py backend/tests/test_semantic_clarification_contract_repair.py
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-free-text-no-reask.yml
          git add backend/app/services/semantic_intent_ai.py backend/tests/test_semantic_clarification_contract_repair.py
          git commit -m "fix(nursing): honor explicit free-text answers before clarification"
          git push origin HEAD:fix/nursing-free-text-no-reask
