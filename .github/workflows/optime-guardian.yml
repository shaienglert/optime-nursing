name: OPTIME Guardian

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  optime-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test Guardian status validation
        run: node --test scripts/tests/guardian_status.test.cjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Discard previous Guardian status
        id: guardian_prepare
        run: |
          node -e "const fs=require('fs');fs.rmSync('reports/guardian/status.json',{force:true});fs.appendFileSync(process.env.GITHUB_OUTPUT,'started_ms='+Date.now()+'\n');"

      - name: Run Guardian gate
        id: guardian
        working-directory: frontend
        run: npm run guardian

      - name: Read Guardian status
        id: guardian_status
        if: always() && steps.guardian.outcome != 'skipped'
        env:
          GUARDIAN_STARTED_MS: ${{ steps.guardian_prepare.outputs.started_ms }}
        run: node scripts/read_guardian_status.cjs >> "$GITHUB_OUTPUT"

      - name: Upload Guardian artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optime-guardian-report-${{ github.run_id }}
          path: reports/guardian
          if-no-files-found: error

      - name: Create or update Guardian incident issue
        if: always() && steps.guardian_status.outputs.verdict == 'BLOCK'
        uses: actions/github-script@v7
        with:
          script: |
            const fingerprint = '${{ steps.guardian_status.outputs.fingerprint }}';
            const violations = '${{ steps.guardian_status.outputs.violations }}';
            const marker = `guardian-fingerprint:${fingerprint}`;
            const title = `Guardian BLOCK ${fingerprint}`;
            const label = 'guardian-block';

            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (!labels.find((entry) => entry.name === label)) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'B60205',
                description: 'Guardian constitutional block incident',
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            const existing = issues.find((issue) => (issue.body || '').includes(marker));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `OPTIME Guardian returned BLOCK.`,
              ``,
              `- Fingerprint: ${fingerprint}`,
              `- Violations: ${violations}`,
              `- Workflow run: ${runUrl}`,
              ``,
              marker,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Enforce Guardian gate
        if: always()
        env:
          GUARDIAN_PROCESS_OUTCOME: ${{ steps.guardian.outcome }}
          GUARDIAN_STATUS_OUTCOME: ${{ steps.guardian_status.outcome }}
          GUARDIAN_VERDICT: ${{ steps.guardian_status.outputs.verdict }}
        run: |
          node -e "if(process.env.GUARDIAN_PROCESS_OUTCOME!=='success'||process.env.GUARDIAN_STATUS_OUTCOME!=='success'||!['PASS','WARN'].includes(process.env.GUARDIAN_VERDICT)){console.error('Guardian failed, blocked, or did not produce a valid current report.');process.exit(1);}"
