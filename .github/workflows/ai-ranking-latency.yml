name: Nursing AI Ranking Latency Gate

on:
  pull_request:
    paths:
      - 'backend/app/services/ai_candidate_ranking_runtime.py'
      - 'backend/tests/test_ai_candidate_ranking_batch_runtime.py'
      - '.github/workflows/ai-ranking-latency.yml'
  workflow_dispatch:

jobs:
  batched-ranking:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest backend.tests.test_ai_candidate_ranking_batch_runtime
