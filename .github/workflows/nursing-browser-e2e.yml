name: Nursing Browser E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start Next.js
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/optime-nursing-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/adaptive-interview >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/optime-nursing-next.log
          exit 1
      - run: npx playwright test tests/browser/adaptive-interview-buttons.spec.cjs --reporter=line --workers=1
      - name: Live production two-path equivalence
        run: npx playwright test tests/browser/live-production-equivalence.spec.cjs --reporter=line --workers=1
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/optime-nursing-next.log || true
