name: Oomnik Production Synthetic Journey
# Production run trigger: scenario 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oomnik-production-synthetic-journey.yml'
      - 'frontend/tests/browser/production-synthetic-journey.spec.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oomnik-production-synthetic-journey.yml'
      - 'frontend/tests/browser/production-synthetic-journey.spec.cjs'
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic scenario identifier
        required: true
        default: memory_mom
        type: choice
        options: [memory_mom, independent_mom]

jobs:
  run-live-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run one synthetic family through production
        env:
          OOMNIK_PRODUCTION_URL: https://optime-nursing.vercel.app
          OOMNIK_SCENARIO: ${{ inputs.scenario || 'memory_mom' }}
        run: npx playwright test tests/browser/production-synthetic-journey.spec.cjs --reporter=line --workers=1
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-synthetic-journey-diagnostics
          path: frontend/test-results
          if-no-files-found: ignore
