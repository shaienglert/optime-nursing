name: Apply Nevada Profile UI Patch

on:
  push:
    branches:
      - fix/nevada-production-facility-profile-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/nevada-production-facility-profile-ui
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/apply_nevada_profile_ui_patch.py
      - name: Commit patched backend when needed
        run: |
          if git diff --quiet -- backend/app/main.py; then
            echo "No backend patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git commit -m "fix(nursing): link Nevada recommendations to canonical profiles"
          git push origin HEAD:fix/nevada-production-facility-profile-ui
