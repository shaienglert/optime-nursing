name: Patch Independent Setting Priority

on:
  push:
    branches:
      - fix/nursing-explicit-free-text-evidence

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'apply independent living final-rank priority')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nursing-explicit-free-text-evidence
      - name: Patch ranking
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/client_intent_runtime.py')
          s = p.read_text()
          old = '''    return (\n        gate_order,\n        -nice_matches,'''
          new = '''    care_setting = row.get("care_setting_fit") if isinstance(row.get("care_setting_fit"), dict) else {}\n    modalities = {_upper(row.get("canonical_type"))}\n    modalities.update(_upper(value) for value in row.get("housing_modalities") or [])\n    if "INDEPENDENT_LIVING" in modalities or "LIFE_PLAN_CCRC" in modalities:\n        setting_order = 0\n    else:\n        setting_order = {"PRIMARY_FIT": 0, "POSSIBLE_FIT": 1, "OVERLEVEL": 2, "INSUFFICIENT_SETTING": 3}.get(_upper(care_setting.get("status")), 1)\n\n    return (\n        gate_order,\n        setting_order,\n        -nice_matches,'''
          if old not in s:
              raise SystemExit('target ranking tuple not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/services/client_intent_runtime.py
          git commit -m "fix(nursing): apply independent living final-rank priority"
          git push origin HEAD:fix/nursing-explicit-free-text-evidence
