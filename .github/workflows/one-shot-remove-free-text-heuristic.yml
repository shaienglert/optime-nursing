name: One-shot remove free-text heuristic

on:
  push:
    branches: [fix/nursing-explicit-free-text-evidence]
    paths: [.github/workflows/one-shot-remove-free-text-heuristic.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nursing-explicit-free-text-evidence
      - name: Remove runtime free-text heuristic, keep AI contract rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/semantic_intent_ai.py')
          s = p.read_text()
          old = '''    salient = {"mobility", "cognitive", "location", "budget"}\n\n    free_text_terms = _question_terms(user_text)\n    if current & free_text_terms & salient:\n        return True\n\n    for entry in _adaptive_answer_summary(questionnaire_state):\n'''
          new = '''    salient = {"mobility", "cognitive", "location", "budget"}\n    for entry in _adaptive_answer_summary(questionnaire_state):\n'''
          if old not in s:
              raise SystemExit('target heuristic block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Add regression guard
        run: |
          cat > backend/tests/test_semantic_free_text_contract_only.py <<'PY'
          from app.services.semantic_intent_ai import SEMANTIC_AI_SYSTEM_RULES, _build_prompt, _question_reasks_answered_dimension

          def test_explicit_free_text_is_ai_contract_not_runtime_topic_heuristic():
              packet = {"next_question": "Does she have any mobility limitations?"}
              assert _question_reasks_answered_dimension(packet, {}, "She has no mobility limitation.") is False
              assert any("explicit free-text client statements" in rule.lower() for rule in SEMANTIC_AI_SYSTEM_RULES)
              prompt = _build_prompt("She has no mobility limitation.", {}, {"advisor":"x","available_agent_count":0,"agent_count":0})
              assert "free_text_answer_rule" in prompt["response_constraints"]
          PY
          python -m py_compile backend/app/services/semantic_intent_ai.py backend/tests/test_semantic_free_text_contract_only.py
      - name: Remove workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-remove-free-text-heuristic.yml
          git add backend/app/services/semantic_intent_ai.py backend/tests/test_semantic_free_text_contract_only.py
          git commit -m "fix(nursing): keep free-text de-duplication AI-owned"
          git push origin HEAD:fix/nursing-explicit-free-text-evidence
