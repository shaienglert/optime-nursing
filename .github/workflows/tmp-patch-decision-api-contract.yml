name: Temporary Decision API Contract Patch

on:
  push:
    branches:
      - test/decision-interview-production-variants
    paths:
      - '.github/workflows/tmp-patch-decision-api-contract.yml'
      - 'scripts/tmp_patch_decision_api_contract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/decision-interview-production-variants
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch API contracts and remove temporary patcher
        run: python scripts/tmp_patch_decision_api_contract.py
      - name: Commit deterministic patch
        run: |
          git config user.name "optime-ci"
          git config user.email "optime-ci@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0 || true
          git commit -m "fix(nursing): preserve decision intelligence across API contracts"
          git push origin HEAD:test/decision-interview-production-variants
