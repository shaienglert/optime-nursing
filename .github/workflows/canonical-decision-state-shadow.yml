name: Canonical Decision State Shadow

on:
  pull_request:
    paths:
      - 'backend/app/services/canonical_decision_state.py'
      - 'backend/tests/test_canonical_decision_state.py'
      - 'backend/gold_examples/validate_canonical_state_shadow.py'
      - 'backend/docs/NURSING_READINESS_STATE_MACHINE_V1.md'
      - '.github/workflows/canonical-decision-state-shadow.yml'
  workflow_dispatch:

jobs:
  canonical-decision-state-shadow:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend runtime dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Run canonical decision state unit tests
        run: python -m pytest backend/tests/test_canonical_decision_state.py -q
      - name: Run lifecycle shadow comparison
        run: python backend/gold_examples/validate_canonical_state_shadow.py
