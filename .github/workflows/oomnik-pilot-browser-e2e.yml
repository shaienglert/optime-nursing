name: Oomnik Pilot Real Browser E2E

on:
  pull_request:
    paths:
      - '.github/workflows/oomnik-pilot-browser-e2e.yml'
      - 'frontend/tests/browser/pilot-real-journey.spec.cjs'
      - 'frontend/src/**'
      - 'backend/app/services/facility_parameter_service.py'
      - 'scripts/validate_synthetic_pilot.cjs'
  workflow_dispatch:

jobs:
  real-pilot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_INTERNAL_API_URL: https://oomnik-nursing-pilot.onrender.com
      NEXT_PUBLIC_API_URL: https://oomnik-nursing-pilot.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start pilot-routed website
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/oomnik-pilot-next.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/intake >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/oomnik-pilot-next.log
          exit 1
      - name: Run real customer journey
        run: npx playwright test tests/browser/pilot-real-journey.spec.cjs --reporter=line --workers=1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oomnik-pilot-real-browser-diagnostics
          path: |
            frontend/test-results
            /tmp/oomnik-pilot-next.log
          if-no-files-found: ignore
