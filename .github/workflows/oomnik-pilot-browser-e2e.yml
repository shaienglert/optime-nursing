name: Oomnik Pilot Real Browser E2E

on:
  pull_request:
    paths:
      - '.github/workflows/oomnik-pilot-browser-e2e.yml'
      - 'frontend/tests/browser/pilot-real-journey.spec.cjs'
      - 'frontend/src/**'
      - 'backend/app/services/facility_parameter_service.py'
      - 'scripts/validate_synthetic_pilot.cjs'
  workflow_dispatch:
    inputs:
      scenario_start:
        description: First zero-based scenario index
        required: true
        default: '0'
      scenario_count:
        description: Number of real browser journeys
        required: true
        default: '10'
      workers:
        description: Parallel Playwright workers
        required: true
        default: '1'
      expected_cohort:
        description: Expected synthetic facility cohort size
        required: true
        default: '200'

jobs:
  real-pilot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_INTERNAL_API_URL: https://oomnik-nursing-pilot.onrender.com
      NEXT_PUBLIC_API_URL: https://oomnik-nursing-pilot.onrender.com
      OOMNIK_SCENARIO_START: ${{ github.event.inputs.scenario_start || '0' }}
      OOMNIK_SCENARIO_COUNT: ${{ github.event.inputs.scenario_count || '10' }}
      OOMNIK_EXPECTED_COHORT: ${{ github.event.inputs.expected_cohort || '200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start pilot-routed website
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/oomnik-pilot-next.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/intake >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/oomnik-pilot-next.log
          exit 1
      - name: Run real customer journey
        run: npx playwright test tests/browser/pilot-real-journey.spec.cjs --reporter=line --workers=${{ github.event.inputs.workers || '1' }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oomnik-pilot-real-browser-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/pilot-results
            /tmp/oomnik-pilot-next.log
          if-no-files-found: ignore
