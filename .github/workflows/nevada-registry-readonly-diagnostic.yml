name: Nevada government registry read-only diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - fix/nevada-license-expiry-gate-20261111
    paths:
      - .github/workflows/nevada-registry-readonly-diagnostic.yml
permissions:
  contents: read
jobs:
  official-registry-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Fetch Nevada HCQC ALiS including credential details, read only
        run: python scripts/refresh_nevada_registry.py --dry-run
      - name: Publish read-only diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-registry-readonly-diagnostic
          path: reports/NEVADA_REGISTRY_REFRESH.json
          if-no-files-found: warn
          retention-days: 14
