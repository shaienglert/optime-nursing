name: Isolated Neon live read verification
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-isolated-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      OPTIME_CANONICAL_MARKET: synthetic-pilot
      OOMNIK_PILOT_SOURCE: neon
      OOMNIK_PILOT_FACILITY_LIMIT: '500'
      OOMNIK_PILOT_DATABASE_URL: ${{ secrets.OOMNIK_PILOT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify isolated database connectivity and catalog
        shell: bash
        run: |
          if [ -z "$OOMNIK_PILOT_DATABASE_URL" ]; then
            echo "::error::Configure repository secret OOMNIK_PILOT_DATABASE_URL for isolated Neon pilot"
            exit 1
          fi
          python - <<'PY'
          from app.services.isolated_pilot_reader import read_isolated_pilot
          facilities, evidence = read_isolated_pilot()
          assert len(facilities) == 500
          assert len(evidence) == 16320
          print(f"Isolated Neon catalog verified: {len(facilities)} facilities, {len(evidence)} evidence records")
          PY
