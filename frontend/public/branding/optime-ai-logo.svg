<svg class="stage" viewBox="0 0 500 590" xmlns="http://www.w3.org/2000/svg">
  <!-- ===== COMPASS TIPS ===== -->
  <g fill="#1a1a1a">
    <polygon id="tipN" points="250,20 262,90 238,90"></polygon>
    <polygon points="250,20 262,90 238,90" transform="rotate(180 250 250)"></polygon>
    <polygon points="250,20 262,90 238,90" transform="rotate(90 250 250)"></polygon>
    <polygon points="250,20 262,90 238,90" transform="rotate(-90 250 250)"></polygon>
  </g>

  <!-- ===== MAZE RINGS ===== -->
  <g fill="none" stroke="#1a1a1a" stroke-width="10">
    <circle cx="250" cy="250" r="215"></circle>
    <circle cx="250" cy="250" r="180" stroke-dasharray="120 20"></circle>
    <circle cx="250" cy="250" r="145"></circle>
    <circle cx="250" cy="250" r="110" stroke-dasharray="90 18"></circle>
    <circle cx="250" cy="250" r="75"></circle>
  </g>
  <!-- radial maze walls -->
  <g stroke="#1a1a1a" stroke-width="10" stroke-linecap="square">
    <line x1="250" y1="35" x2="250" y2="75"></line>
    <line x1="250" y1="465" x2="250" y2="425"></line>
    <line x1="35" y1="250" x2="75" y2="250"></line>
    <line x1="465" y1="250" x2="425" y2="250"></line>
    <line x1="165" y1="90" x2="165" y2="145"></line>
    <line x1="335" y1="90" x2="335" y2="145"></line>
    <line x1="90" y1="335" x2="145" y2="335"></line>
    <line x1="410" y1="165" x2="355" y2="165"></line>
    <line x1="130" y1="230" x2="180" y2="230"></line>
    <line x1="320" y1="270" x2="370" y2="270"></line>
    <line x1="230" y1="130" x2="230" y2="180"></line>
  </g>

  <!-- ===== COMPASS LETTERS ===== -->
  <g fill="#5aa62b" font-family="Arial, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    <text x="250" y="60">N</text>
    <text x="250" y="460">S</text>
    <text x="65" y="257">W</text>
    <text x="435" y="257">E</text>
  </g>

  <!-- ===== ANIMATED GREEN ESCAPE PATH ===== -->
  <circle cx="250" cy="250" r="14" fill="none" stroke="#5aa62b" stroke-width="9"></circle>

  <path id="escapePath" d="M250,250
           C250,300 260,330 252,365
           C246,395 255,430 262,478
           C266,502 264,522 263,543
           M250,250
           C250,205 235,180 250,155
           C265,130 260,100 300,90
           C335,80 340,105 375,95" fill="none" stroke="#5aa62b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray: 554.599; stroke-dashoffset: 0;"></path>

  <!-- arrowhead: hidden until score is high -->
  <polygon id="arrowHead" points="0,-16 34,0 0,16" fill="#5aa62b" transform="translate(375,95) rotate(-22) scale(1)" opacity="0" style="opacity: 1;"></polygon>

  <!-- soft glow halo behind the true house, appears at completion -->
  <circle id="houseGlow" cx="420" cy="68" r="55" fill="#5aa62b" opacity="0.18"></circle>

  <!-- ===== TRUE-EXIT HOME WITH GARDEN ===== -->
  <g id="trueHouse" transform="translate(420,68) scale(1.4009999999999998)" style="color: #5aa62b;">
    <!-- garden bed -->
    <ellipse cx="0" cy="20" rx="46" ry="20" fill="#eef7e4"></ellipse>
    <!-- bushes -->
    <circle cx="-30" cy="12" r="10" fill="#6fbf3f"></circle>
    <circle cx="-20" cy="16" r="7" fill="#4f9a2a"></circle>
    <circle cx="30" cy="14" r="9" fill="#6fbf3f"></circle>
    <circle cx="21" cy="18" r="6" fill="#4f9a2a"></circle>
    <!-- little tree -->
    <line x1="-38" y1="0" x2="-38" y2="16" stroke="#8a6242" stroke-width="3" stroke-linecap="round"></line>
    <circle cx="-38" cy="-8" r="10" fill="#5aa62b"></circle>
    <!-- flowers -->
    <circle cx="-8" cy="26" r="2.4" fill="#e6b800"></circle>
    <circle cx="0" cy="30" r="2.4" fill="#e0546b"></circle>
    <circle cx="9" cy="27" r="2.4" fill="#ffffff" stroke="#e0546b" stroke-width="1"></circle>
    <circle cx="16" cy="30" r="2.4" fill="#e6b800"></circle>
    <!-- chimney -->
    <rect x="9" y="-24" width="5" height="10" fill="currentColor"></rect>
    <!-- roof -->
    <polygon points="-22,-2 0,-24 22,-2" fill="currentColor"></polygon>
    <!-- walls -->
    <rect x="-18" y="-2" width="36" height="22" fill="currentColor"></rect>
    <!-- window -->
    <rect x="8" y="2" width="7" height="7" fill="#ffffff"></rect>
    <line x1="11.5" y1="2" x2="11.5" y2="9" stroke="currentColor" stroke-width="1"></line>
    <line x1="8" y1="5.5" x2="15" y2="5.5" stroke="currentColor" stroke-width="1"></line>
    <!-- door -->
    <rect x="-6" y="8" width="11" height="12" rx="1" fill="#ffffff"></rect>
    <circle cx="1.5" cy="14" r="0.9" fill="currentColor"></circle>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="52" text-anchor="middle" letter-spacing="2">
    <text x="250" y="545" fill="#1a1a1a">
      <tspan fill="#5aa62b">O</tspan>PT<tspan fill="#5aa62b">I</tspan>ME
    </text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle" letter-spacing="1">
    <text x="250" y="572" fill="#1a1a1a">FINDING YOU THE <tspan fill="#5aa62b">RIGHT</tspan> WAY</text>
  </g>
  <line x1="130" y1="567" x2="160" y2="567" stroke="#5aa62b" stroke-width="2"></line>
  <line x1="340" y1="567" x2="370" y2="567" stroke="#5aa62b" stroke-width="2"></line>
</svg>